apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  labels:
    app: my-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
        - name: my-app
          image: mizolf/backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: jwt-secret
            - name: SUPPORT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: support-email
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: gemini-api
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: app-password